[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eskf-ref"
version = "0.1.0"
description = "PC logger and offline analysis for Arduino ESKF vs iPhone reference state."
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
eskf-ref = "eskf_ref.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
